services:
  scrutator:
    build: .
    network_mode: host
    env_file: .env
    environment:
      SCRUTATOR_EMBEDDING_DENSE_SPARSE_ENABLED: "${SCRUTATOR_EMBEDDING_DENSE_SPARSE_ENABLED:-false}"
      # Dedicated bounded corpus written by the existing feeder credential.
      # Preserve every operator-configured namespace and append only this scope.
      #
      # `talomnia` (SRCH-0044): the corpus began projecting Projects/Talomnia
      # docs on 2026-08-19 into a namespace that was never on this list, so the
      # feeder has been refused write on it and kb-reconcile has exited
      # 4/NOPERMISSION on every run since — 765 runs as of 2026-08-30, each
      # re-walking and re-scanning the whole 2,132-file corpus. Two files are
      # affected: Projects/Talomnia/README.md and
      # Projects/Talomnia/docs/TZ-Talomnia-Launch-v1.3.1.md. It is the ONLY
      # namespace the projection produces that this list does not cover.
      SCRUTATOR_FEEDER_NAMESPACES: "${SCRUTATOR_FEEDER_NAMESPACES:-},self-improvement,arcanada-design-system,skills,talomnia"
      SCRUTATOR_ROLLBACK_NAMESPACES: "${SCRUTATOR_ROLLBACK_NAMESPACES:-},skills"
    restart: unless-stopped
    volumes:
      - scrutator-logs:/app/logs
      - type: bind
        source: /var/lib/scrutator/ltm-reflect
        target: /var/lib/scrutator/ltm-reflect
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8310/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  scrutator-logs:
