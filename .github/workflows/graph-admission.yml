          #!/usr/bin/env python3
          import json, pathlib, subprocess, sys, tempfile

          def bounded(value, limit=4096):
              encoded = value.encode("utf-8", errors="replace")
              if len(encoded) <= limit:
                  return value
              marker = b"\n...[truncated]\n"
              prefix = encoded[:limit - len(marker)]
              while True:
                  try:
                      text = prefix.decode("utf-8")
                      break
                  except UnicodeDecodeError as error:
                      prefix = prefix[:error.start]
              return text + marker.decode("ascii")

          def qualify(root, executable):
              root = pathlib.Path(root).resolve()
              executable = pathlib.Path(executable)
              expected = root / "node_modules/typescript/bin/tsc"
              if executable.resolve() != expected:
                  raise ValueError("TSC_EXECUTABLE_OUTSIDE_PINNED_PACKAGE")
              package = json.loads((root / "node_modules/typescript/package.json").read_text())
              if package["version"] != "7.0.2":
                  raise ValueError("TSC_PACKAGE_VERSION_MISMATCH")
              result = subprocess.run([str(executable), "--version"], capture_output=True, text=True, timeout=20)
              if result.returncode != 0 or result.stdout.strip() != "Version 7.0.2":
                  raise ValueError("TSC_EXECUTABLE_VERSION_MISMATCH")
              # compiler_root is created under RUNNER_TEMP; keep controls outside the caller checkout
              # and independent of an inherited TMPDIR that could point into that checkout.
              with tempfile.TemporaryDirectory(prefix="aup-tsc-controls-", dir=root.parent) as scratch:
                  path = pathlib.Path(scratch)
                  for ancestor in (path, *path.parents):
                      if any((ancestor / name).exists() for name in ("tsconfig.json", "package.json")):
                          raise ValueError("TSC_CONTROL_WORKDIR_NOT_ISOLATED")
                  for filename, contents, expected_success in [
                      ("valid.ts", "const value: number = 1;\n", True),
                      ("invalid.ts", "const value: number = 'wrong';\n", False),
                  ]:
                      source = path / filename
                      source.write_text(contents)
                      result = subprocess.run([str(executable), "--noEmit", "--strict", "--skipLibCheck", str(source)], capture_output=True, text=True, errors="replace", timeout=30, cwd=path)
                      if (result.returncode == 0) != expected_success:
                          expected_code = "0" if expected_success else "nonzero"
                          sys.stderr.write(f"TSC_CONTROL_FAILURE file={filename} expected_exit_code={expected_code} actual_exit_code={result.returncode}\n")
                          sys.stderr.write("tsc stdout (max 4096 bytes):\n" + bounded(result.stdout))
                          sys.stderr.write("tsc stderr (max 4096 bytes):\n" + bounded(result.stderr))
                          raise ValueError("TSC_SEMANTIC_CONTROL_FAILED:" + filename)
              return {"version": "7.0.2", "executable": str(executable.resolve()), "valid_input": "PASS", "invalid_input": "REFUSED"}

          if __name__ == "__main__":
              print(json.dumps(qualify(sys.argv[1], sys.argv[2]), sort_keys=True))
          AUP_QUALIFY_TSC_PY
          : > "$compiler_root/user.npmrc"
          : > "$compiler_root/global.npmrc"
          npm ci --prefix "$compiler_root" --ignore-scripts --no-audit --no-fund --cache "$compiler_root/npm-cache" --userconfig "$compiler_root/user.npmrc" --globalconfig "$compiler_root/global.npmrc" --registry https://registry.npmjs.org
          # In the Program repository, the workflow tests the source tools in tools/graph.
          # Callers run the pinned vendored copy under inputs.tools_path (normally
          # .github/graph-admission), so installing beside the Program source path would leave
          # that copy unable to resolve its compiler.
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/arcanada-universal-program" ]; then
            graph_tools_rel="tools/graph"
          else
            tools_rel="${TOOLS_PATH:-.github/graph-admission}"
            case "$tools_rel" in
              ''|/*|*/|.)
                echo "::error::invalid relative tools_path for the vendored admission tools" >&2
                exit 2
                ;;
            esac
            case "/$tools_rel/" in
              *"/../"*|*"/./"*|*//*|*\\*)
                echo "::error::unsafe relative tools_path for the vendored admission tools" >&2
                exit 2
                ;;
            esac
            graph_tools_rel="$tools_rel/tools/graph"
          fi
          workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
          graph_tools_path="$workspace_real/$graph_tools_rel"
          if [ ! -d "$graph_tools_path" ]; then
            echo "::error::admission tools directory is missing: $graph_tools_rel" >&2
            exit 2
          fi
          graph_tools_real="$(realpath -e -- "$graph_tools_path")"
          if [ "$graph_tools_real" != "$graph_tools_path" ]; then
            echo "::error::admission tools directory resolves through a symlink" >&2
            exit 2
          fi
          graph_modules="$graph_tools_real/node_modules"
          if [ -e "$graph_modules" ] || [ -L "$graph_modules" ]; then
            echo "::error::$graph_tools_rel/node_modules already exists; refusing to replace it" >&2
            exit 2
          fi
          printf '/%s/node_modules\n' "$graph_tools_rel" >> .git/info/exclude
          ln -s "$compiler_root/node_modules" "$graph_modules"
          python3 "$compiler_root/qualify-tsc.py" "$compiler_root" "$compiler_root/node_modules/.bin/tsc"
          printf '%s\n' "$compiler_root/node_modules/.bin" >> "$GITHUB_PATH"

      # The prior bundle_preflight step is the trust boundary for callers. Only after it succeeds may
      # this job import the pinned native structural classifier. The classifier sees GitHub's exact
      # checked-out range; it does not consume caller-authored eligibility or branch names.
      - name: Classify the authenticated current range for native self-update issuance
        id: self_update_classifier
        if: github.repository != 'Arcanada-one/arcanada-universal-program'
        env:
          TOOLS_PATH: ${{ inputs.tools_path }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RANGE_BASE_BRANCH: ${{ steps.range.outputs.base_branch }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -I -B - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bundle_rel = os.environ["TOOLS_PATH"]
          base, head = os.environ["RANGE_BASE"], os.environ["RANGE_HEAD"]
          if not re.fullmatch(r"[0-9a-f]{40}", base) or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("SELF_UPDATE_CLASSIFICATION_REFUSED: exact GitHub range is unavailable")
          bundle = (repo / bundle_rel).resolve(strict=True)
          if repo not in bundle.parents or not (bundle / "tools/graph/admit_change.py").is_file():
              raise SystemExit("SELF_UPDATE_CLASSIFICATION_REFUSED: authenticated Program tools path is unsafe")
          sys.path.insert(0, str(bundle / "tools/graph"))
          import admit_change

          files = admit_change.range_files(repo, base, head)
          base_branch = os.environ.get("RANGE_BASE_BRANCH") or None
          case, evidence = admit_change.structural_case(repo, base, head, files, bundle_rel, base_branch)
          if case == "gate_self_update" and not base_branch:
              raise SystemExit("SELF_UPDATE_CLASSIFICATION_REFUSED: exact pull-request base branch is unavailable")
          if case not in (None, "gate_self_update"):
              case = ""
          print("case=" + (case or ""))
          print("native_classifier=admit_change.structural_case")
          print("range=" + base + ".." + head)
          PY

      - name: Prepare canonical Scrutator contract verifier dependencies
        if: github.repository == 'Arcanada-one/scrutator' && (inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update')
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          test -f contracts/http/package.json && test ! -L contracts/http/package.json
          test -f contracts/http/tsconfig.json && test ! -L contracts/http/tsconfig.json
          git diff --quiet "$RANGE_BASE" "$RANGE_HEAD" -- contracts/http/package.json contracts/http/tsconfig.json
          contract_root=$(mktemp -d "${RUNNER_TEMP}/scrutator-contract-ts.XXXXXX")
          cat > "$contract_root/package.json" <<'SCRUTATOR_PACKAGE_JSON'
          {"name":"scrutator-contract-graph-verifier","version":"1.0.0","private":true,"dependencies":{"typescript":"5.9.3","zod":"4.6.5"}}
          SCRUTATOR_PACKAGE_JSON
          cat > "$contract_root/package-lock.json" <<'SCRUTATOR_PACKAGE_LOCK_JSON'
          {
            "name":"scrutator-contract-graph-verifier","version":"1.0.0","lockfileVersion":3,"requires":true,
            "packages":{
              "":{"name":"scrutator-contract-graph-verifier","version":"1.0.0","dependencies":{"typescript":"5.9.3","zod":"4.6.5"}},
              "node_modules/typescript":{"version":"5.9.3","resolved":"https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz","integrity":"sha512-jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw==","bin":{"tsc":"bin/tsc","tsserver":"bin/tsserver"},"engines":{"node":">=14.17"}},
              "node_modules/zod":{"version":"4.6.5","resolved":"https://registry.npmjs.org/zod/-/zod-4.6.5.tgz","integrity":"sha512-v5l/aFXZQeai4awLbOpSoHecE9UiMrnfx75tEXLjNonXVARxQ5mOeipTjROUchszUNCqnE+hqAMujRsRHsut2Q=="}
            }
          }
          SCRUTATOR_PACKAGE_LOCK_JSON
          : > "$contract_root/user.npmrc"
          : > "$contract_root/global.npmrc"
          npm ci --prefix "$contract_root" --ignore-scripts --no-audit --no-fund --cache "$contract_root/npm-cache" --userconfig "$contract_root/user.npmrc" --globalconfig "$contract_root/global.npmrc" --registry https://registry.npmjs.org
          export CONTRACT_ROOT="$contract_root"
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          package = json.loads(Path('contracts/http/package.json').read_text(encoding='utf-8'))
          if package.get('name') != '@arcanada/scrutator-http-contract' or package.get('devDependencies') != {'typescript': '5.9.3', 'zod': '4.6.5'}:
              raise SystemExit('SCRUTATOR_CONTRACT_DEPENDENCY_SUBJECT_REFUSED')
          root = Path(os.environ['CONTRACT_ROOT']).resolve(strict=True)
          for name, version in (('typescript', '5.9.3'), ('zod', '4.6.5')):
              installed = json.loads((root / 'node_modules' / name / 'package.json').read_text(encoding='utf-8'))
              if installed.get('version') != version:
                  raise SystemExit('SCRUTATOR_CONTRACT_PINNED_PACKAGE_MISMATCH:' + name)
          PY
          contract_modules="$GITHUB_WORKSPACE/contracts/http/node_modules"
          if [ -e "$contract_modules" ] || [ -L "$contract_modules" ]; then
            echo "::error::contracts/http/node_modules already exists; refusing to replace it" >&2
            exit 2
          fi
          printf '/contracts/http/node_modules\n' >> .git/info/exclude
          ln -s "$contract_root/node_modules" "$contract_modules"

      # A caller may opt into one fixed MUN setup policy. The signed bundle validates
      # exact repository/range/package/lock/blob pins before Node or pnpm executes; the caller input
      # contains data only and cannot choose commands, paths, registries, or environment variables.
      - name: Validate fixed caller dependency setup subject and source pins
        id: candidate_dependency_setup
        if: inputs.candidate_dependency_setup_required || inputs.candidate_dependency_setup != ''
        env:
          CANDIDATE_DEPENDENCY_SETUP: ${{ inputs.candidate_dependency_setup }}
          TOOLS_PATH: ${{ inputs.tools_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_DEPENDENCY_SETUP:-}" ]; then
            echo "::error::required caller dependency setup manifest is absent" >&2
            exit 2
          fi
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/arcanada-universal-program" ]; then
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE"
          else
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE/$TOOLS_PATH"
          fi
          PLAN_ROOT="$RUNNER_TEMP/graph-admission/candidate-dependency-setup"
          mkdir -p "$PLAN_ROOT"
          PLAN_PATH="$PLAN_ROOT/plan.json"
          set -C
          python3 -I -B "$GRAPH_TOOLS_ROOT/tools/graph/ci_gate.py" candidate-dependency-setup-plan \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --base "$RANGE_BASE" --head "$RANGE_HEAD" > "$PLAN_PATH"
          NODE_VERSION="$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["node_version"])' "$PLAN_PATH")"
          SETUP_POLICY="$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["policy"])' "$PLAN_PATH")"
          printf 'node_version=%s\nsetup_policy=%s\nplan_path=%s\n' "$NODE_VERSION" "$SETUP_POLICY" "$PLAN_PATH" >> "$GITHUB_OUTPUT"

      - name: Node for the fixed caller dependency setup
        if: inputs.candidate_dependency_setup_required || inputs.candidate_dependency_setup != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ steps.candidate_dependency_setup.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Corepack for the fixed caller dependency setup
        if: inputs.candidate_dependency_setup_required || inputs.candidate_dependency_setup != ''
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/corepack-bin"
          corepack enable --install-directory "${RUNNER_TEMP}/corepack-bin"
          echo "${RUNNER_TEMP}/corepack-bin" >> "$GITHUB_PATH"

      - name: Install frozen caller dependencies before candidate verification
        if: inputs.candidate_dependency_setup_required || inputs.candidate_dependency_setup != ''
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PLAN_PATH="$RUNNER_TEMP/graph-admission/candidate-dependency-setup/plan.json"
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          cat "$PLAN_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Muneral shared types before Prisma generation
        if: >-
          github.repository == 'Arcanada-one/muneral' &&
          (steps.candidate_dependency_setup.outputs.setup_policy == 'pnpm-frozen-web-typecheck/v1' ||
          steps.candidate_dependency_setup.outputs.setup_policy == 'pnpm-frozen-api-prisma-typecheck/v1')
        run: pnpm --filter @muneral/types build

      - name: Generate Prisma Client for fixed caller dependency setup
        if: >-
          github.repository == 'Arcanada-one/muneral' &&
          (inputs.candidate_dependency_setup_required || inputs.candidate_dependency_setup != '')
        env:
          # This non-secret placeholder is consumed only by Prisma generation; generate does not connect.
          CHECKPOINT_DISABLE: '1'
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          SETUP_POLICY: ${{ steps.candidate_dependency_setup.outputs.setup_policy }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::fixed Prisma generation DATABASE_URL is missing" >&2
            exit 2
          fi
          case "$SETUP_POLICY" in
            pnpm-frozen-web-typecheck/v1|pnpm-frozen-api-prisma-typecheck/v1)
              pnpm exec prisma generate --config prisma.config.ts --schema apps/api/prisma/schema.prisma
              ;;
            *)
              echo "::error::validated dependency setup policy is unsupported" >&2
              exit 2
              ;;
          esac

      - name: Allocate current-candidate capture for this job
        id: candidate_capture
        if: >-
          (github.repository == 'Arcanada-one/muneral' &&
          (inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update')) ||
          (github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # The initial runner-temp step owns graph-admission. Allocate a separate evidence
          # directory so an earlier capture cannot be mistaken for this job's output.
          parent="${RUNNER_TEMP:?}/graph-admission"
          [[ -O "$parent" && -d "$parent" && "$(realpath -e -- "$parent")" == "$parent" ]]
          stage_parent="$parent/stage-userpath"
          if [[ ! -e "$stage_parent" && ! -L "$stage_parent" ]]; then
            mkdir -m 700 -- "$stage_parent"
          fi
          [[ -O "$stage_parent" && -d "$stage_parent" && "$(realpath -e -- "$stage_parent")" == "$stage_parent" ]]
          root="$(mktemp -d -- "$stage_parent/run.XXXXXXXX")"
          {
            printf 'stage_root=%s\n' "$root"
            printf 'candidate_root=%s/current-candidate\n' "$root"
          } >> "$GITHUB_OUTPUT"

      # Fixed disposable-store profiles for the only callers whose candidate suites have an
      # explicit disposable backend contract. Repository, profile, images and credentials are
      # source-fixed here; no workflow_call input can select a service or inject its environment.
      # Store values are handed to the candidate producer through a private, per-job data file.
      - name: Start allowlisted candidate disposable stores
        id: candidate_disposable_stores
        if: >-
          (github.repository == 'Arcanada-one/muneral' &&
          (inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update')) ||
          (github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RUNNER_TEMP: ${{ runner.temp }}
          CAPTURE_ROOT: ${{ steps.candidate_capture.outputs.stage_root }}
          GRAPH_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          python3 -I -B - "$RANGE_BASE" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import re
          import subprocess
          import sys

          base, repo = sys.argv[1:]
          refusals = {
              "Arcanada-one/model-connector": "MODEL_CONNECTOR_DISPOSABLE_STORE_PROFILE_REFUSED",
              "Arcanada-one/muneral": "MUNERAL_CANDIDATE_POSTGRES_PROFILE_REFUSED",
          }
          if repo not in refusals:
              raise SystemExit("CANDIDATE_DISPOSABLE_STORE_REPOSITORY_REFUSED")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit(refusals[repo])
          try:
              raw = subprocess.run(["git", "show", base + ":.arcana/verify.json"],
                                   check=True, capture_output=True).stdout
              root = json.loads(raw)["deployables"]["."]
              if repo == "Arcanada-one/model-connector":
                  arms = root["full_test_arms"]
                  matches = [
                      arm for arm in arms if isinstance(arm, dict)
                      and arm.get("name") == "integration-disposable-store"
                  ] if isinstance(arms, list) else []
                  valid = matches == [{"name": "integration-disposable-store", "requires": "real_disposable"}]
              else:
                  full = root["full_test"]
                  valid = isinstance(full, list) and bool(full)
          except (KeyError, TypeError, ValueError, subprocess.CalledProcessError):
              valid = False
          if not valid:
              raise SystemExit(refusals[repo])
          PY
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker is required for the allowlisted candidate disposable-store profile" >&2
            exit 2
          fi
          [[ -d "$CAPTURE_ROOT" && -O "$CAPTURE_ROOT" && "$(realpath -e -- "$CAPTURE_ROOT")" == "$CAPTURE_ROOT" ]]
          [[ "${CAPTURE_ROOT%/*}" == "$RUNNER_TEMP/graph-admission/stage-userpath" && "${CAPTURE_ROOT##*/}" == run.* ]]
          STORE_BINDING="$RUNNER_TEMP/graph-admission/${CAPTURE_ROOT##*/}.stores"
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ||
                ! "$GRAPH_CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid disposable-store job identity" >&2
            exit 2
          fi
          STORE_JOB="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GRAPH_CHECK_RUN_ID}"
          case "$GITHUB_REPOSITORY" in
            Arcanada-one/muneral)
              PROFILE=muneral-candidate-postgres-v1
              NAME="muneral-ga-pg-${STORE_JOB}"
              DB=muneral_test
              PASS="$(openssl rand -hex 16)"
              ;;
            Arcanada-one/model-connector)
              PROFILE=model-connector-disposable-store-v1
              NAME="model-connector-ga-pg-${STORE_JOB}"
              REDIS_NAME="model-connector-ga-redis-${STORE_JOB}"
              DB=connector_test
              PASS='test'
              # Outside the generic graph-admission cleanup root: an unowned lookalike
              # must survive a refused setup and its cleanup step.
              SOCKET_ROOT="${RUNNER_TEMP}/mc-owned-postgres-${STORE_JOB}"
              SOCKET_DIR="${SOCKET_ROOT}/socket"
              if [[ -e "$SOCKET_ROOT" || -L "$SOCKET_ROOT" ]]; then
                echo "::error::refusing to use an existing disposable PostgreSQL socket path" >&2
                exit 2
              fi
              (
                # Stage inside this job's private capture. The final path only becomes
                # visible after its device/inode marker is complete.
                stage="$CAPTURE_ROOT/.store-socket"
                # This path belongs to the private capture allocated for this job.
                # Preserve an existing stage and arm cleanup before mkdir can create one.
                if [[ -e "$stage" || -L "$stage" ]]; then
                  echo "::error::refusing to use an existing disposable PostgreSQL socket stage" >&2
                  exit 2
                fi
                trap '
                  if [[ -O "$stage" && -d "$stage" && ! -L "$stage" ]]; then
                    rm -f -- "$stage/.owner"
                    rmdir -- "$stage"
                  fi
                ' EXIT
                trap 'exit 143' TERM
                if ! mkdir -m 700 -- "$stage"; then
                  trap - EXIT
                  echo "::error::could not create the disposable PostgreSQL socket stage" >&2
                  exit 2
                fi
                if ! inode="$(stat -c '%d:%i' -- "$stage")" ||
                   ! (umask 077; set -C; printf '%s %s\n' "$STORE_JOB" "$inode" > "$stage/.owner"); then
                  echo "::error::could not record disposable PostgreSQL socket ownership" >&2
                  exit 2
                fi
                # RENAME_NOREPLACE is a single Linux rename with no overwrite or cross-device copy.
                # Use the runner's system libc/Python pair, independent of setup-python's tool cache.
                if env -u LD_LIBRARY_PATH /usr/bin/python3 -I -B - "$stage" "$SOCKET_ROOT" <<'PYTHON'
          import errno
          import os
          import sys

          try:
              import _ctypes
              import ctypes

              rename = ctypes.CDLL(None, use_errno=True).renameat2
          except (ImportError, AttributeError, OSError):
              # EX_CONFIG maps to the workflow's stable ABI refusal below.
              sys.exit(78)
          rename.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
          at_fdcwd, rename_noreplace = -100, 1
          if rename(at_fdcwd, os.fsencode(sys.argv[1]), at_fdcwd, os.fsencode(sys.argv[2]), rename_noreplace):
              error = ctypes.get_errno()
              if error == errno.ENOSYS:
                  sys.exit(78)
              raise OSError(error, os.strerror(error), sys.argv[2])
          PYTHON
                then
                  :
                else
                  status=$?
                  case "$status" in
                    78|126|127)
                      # No fallback: this caller requires the system Python and atomic rename ABI.
                      echo "::error::CANDIDATE_SOCKET_ATOMIC_PUBLISH_UNAVAILABLE: /usr/bin/python3 with _ctypes and renameat2 is required" >&2
                      exit 2
                      ;;
                    *) exit "$status" ;;
                  esac
                fi
              )
              mkdir -m 777 -- "$SOCKET_DIR"
              ;;
          esac
          docker_mount_args=()
          if [ -n "${SOCKET_DIR:-}" ]; then
            docker_mount_args=(-v "${SOCKET_DIR}:/var/run/postgresql")
          fi
          docker run -d --name "$NAME" --label "org.arcanada.graph-store-job=$STORE_JOB" \
            -e POSTGRES_USER=test \
            -e "POSTGRES_PASSWORD=${PASS}" \
            -e "POSTGRES_DB=${DB}" \
            -p 127.0.0.1::5432 \
            "${docker_mount_args[@]}" \
            postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
          PORT="$(docker port "$NAME" 5432/tcp | awk -F: '{print $NF}' | head -n 1)"
          test -n "$PORT"
          for _ in $(seq 1 30); do
            if docker exec "$NAME" pg_isready -h 127.0.0.1 -U test -d "$DB" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$NAME" pg_isready -h 127.0.0.1 -U test -d "$DB"
          URL="postgresql://test:${PASS}@127.0.0.1:${PORT}/${DB}"
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/muneral" ]; then
            echo "::add-mask::${PASS}"
            echo "::add-mask::${URL}"
          else
            # Owned local Unix-socket test fixture; no TCP is exposed for this test path.
            docker exec -i "$NAME" psql -X -v ON_ERROR_STOP=1 -U test -d postgres <<'SQL'
          CREATE ROLE dev LOGIN;
          CREATE ROLE bench_primary_fixture_writer LOGIN;
          CREATE ROLE bench_checkpoint_fixture_writer LOGIN;
          CREATE DATABASE bench_primary_fixture OWNER dev;
          CREATE DATABASE bench_checkpoint_fixture OWNER dev;
          GRANT CONNECT ON DATABASE bench_primary_fixture TO bench_primary_fixture_writer;
          GRANT CONNECT ON DATABASE bench_checkpoint_fixture TO bench_checkpoint_fixture_writer;
          SQL
            FIXTURE_READY="$(docker exec -i "$NAME" psql -XAtq -v ON_ERROR_STOP=1 -U test -d postgres <<'SQL'
          SELECT (SELECT count(*) FROM pg_roles
                  WHERE rolcanlogin AND rolname IN ('dev', 'bench_primary_fixture_writer', 'bench_checkpoint_fixture_writer')) = 3
             AND (SELECT count(*) FROM pg_database
                  WHERE datname IN ('bench_primary_fixture', 'bench_checkpoint_fixture')
                    AND datdba = (SELECT oid FROM pg_roles WHERE rolname = 'dev')) = 2;
          SQL
            )"
            if [ "$FIXTURE_READY" != "t" ]; then
              echo "::error::Model Connector PostgreSQL fixture roles or databases are missing" >&2
              exit 2
            fi
            docker run -d --name "$REDIS_NAME" --label "org.arcanada.graph-store-job=$STORE_JOB" \
              -p 127.0.0.1::6379 \
              redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
            REDIS_PORT="$(docker port "$REDIS_NAME" 6379/tcp | awk -F: '{print $NF}' | head -n 1)"
            test -n "$REDIS_PORT"
            for _ in $(seq 1 30); do
              if [ "$(docker exec "$REDIS_NAME" redis-cli ping 2>/dev/null || true)" = PONG ]; then break; fi
              sleep 2
            done
            test "$(docker exec "$REDIS_NAME" redis-cli ping)" = PONG
            {
              echo "redis_container=${REDIS_NAME}"
              echo "redis_port=${REDIS_PORT}"
              echo "redis_host=127.0.0.1"
              echo "redis_prefix=mc-ga-${STORE_JOB}:"
              echo "bench_socket=${SOCKET_DIR}"
            } >> "$GITHUB_OUTPUT"
          fi
          # NUL-delimited data, never sourced as shell. Keep it outside retained evidence.
          (umask 077; set -C; printf '%s\0' "$PROFILE" "$URL" "${REDIS_PORT:+127.0.0.1}" \
            "${REDIS_PORT:-}" "${REDIS_PORT:+mc-ga-${STORE_JOB}:}" \
            "${SOCKET_DIR:-}" > "$STORE_BINDING")
          {
            echo "postgres_container=${NAME}"
            echo "profile=${PROFILE}"
            echo "database_url=${URL}"
            echo "database_port=${PORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply Muneral Prisma migrations on throwaway Postgres
        if: github.repository == 'Arcanada-one/muneral' && (inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update')
        env:
          DATABASE_URL: ${{ steps.candidate_disposable_stores.outputs.database_url }}
          SETUP_POLICY: ${{ steps.candidate_dependency_setup.outputs.setup_policy }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${SETUP_POLICY:-}"
          # Use the same qualified config and schema as client generation.
          pnpm exec prisma migrate deploy --config prisma.config.ts --schema apps/api/prisma/schema.prisma

      - name: Validate canonical Auth dependency source and toolchain
        id: candidate_auth_dependency_setup
        if: github.repository == 'Arcanada-one/auth-arcana'
        env:
          TOOLS_PATH: ${{ inputs.tools_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE/$TOOLS_PATH"
          PLAN_ROOT="$RUNNER_TEMP/graph-admission/auth-dependency-setup"
          mkdir -p "$PLAN_ROOT"
          PLAN_PATH="$PLAN_ROOT/plan.json"
          set -C
          python3 -I -B "$GRAPH_TOOLS_ROOT/tools/graph/ci_gate.py" candidate-auth-dependency-setup-plan \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --base "$RANGE_BASE" --head "$RANGE_HEAD" > "$PLAN_PATH"
          python3 -I -B - "$PLAN_PATH" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          if plan.get("policy") != "auth-pnpm-frozen-root-account-spa/v1":
              raise SystemExit("AUTH_DEPENDENCY_SETUP_POLICY_REFUSED")
          print("node_version=" + plan["node_version"])
          print("pnpm_version=" + plan["pnpm_version"])
          PY

      - name: Pin pnpm for canonical Auth candidate verification
        if: github.repository == 'Arcanada-one/auth-arcana'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ steps.candidate_auth_dependency_setup.outputs.pnpm_version }}
          dest: ${{ runner.temp }}/auth-setup-pnpm

      - name: Pin Node for canonical Auth candidate verification
        if: github.repository == 'Arcanada-one/auth-arcana'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.candidate_auth_dependency_setup.outputs.node_version }}

      - name: Prepare fixed Auth root and account-SPA verifier dependencies
        if: github.repository == 'Arcanada-one/auth-arcana'
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          RUNNER_TEMP: ${{ runner.temp }}
          AUTH_NODE_VERSION: ${{ steps.candidate_auth_dependency_setup.outputs.node_version }}
        run: |
          set -euo pipefail
          test -f package.json && test ! -L package.json
          test -f pnpm-lock.yaml && test ! -L pnpm-lock.yaml
          CONFIG_ROOT="$RUNNER_TEMP/graph-admission/auth-pnpm-config"
          mkdir -p "$CONFIG_ROOT"
          test ! -e "$CONFIG_ROOT/user.npmrc" && test ! -e "$CONFIG_ROOT/global.npmrc"
          umask 077
          : > "$CONFIG_ROOT/user.npmrc"
          : > "$CONFIG_ROOT/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$CONFIG_ROOT/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$CONFIG_ROOT/global.npmrc"
          pnpm --version | grep -Fx '10.30.3'
          test -n "$AUTH_NODE_VERSION"
          test "$(node --version)" = "v${AUTH_NODE_VERSION}"
          # The source validator pins pnpm-workspace.yaml to base, including its onlyBuiltDependencies allowlist.
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org/
          pnpm exec prisma generate
          cat "$RUNNER_TEMP/graph-admission/auth-dependency-setup/plan.json" >> "$GITHUB_STEP_SUMMARY"

      # Talomnia-backend graph caller has no dependency-setup input. This fixed profile installs
      # the root NestJS / Prisma closure before the current-candidate producer (talomnia-backend#66).
      - name: Validate canonical Talomnia-backend dependency source and toolchain
        id: candidate_talo_dependency_setup
        if: github.repository == 'Arcanada-one/talomnia-backend'
        env:
          TOOLS_PATH: ${{ inputs.tools_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE/$TOOLS_PATH"
          PLAN_ROOT="$RUNNER_TEMP/graph-admission/talo-dependency-setup"
          mkdir -p "$PLAN_ROOT"
          PLAN_PATH="$PLAN_ROOT/plan.json"
          set -C
          python3 -I -B "$GRAPH_TOOLS_ROOT/tools/graph/ci_gate.py" candidate-talo-dependency-setup-plan \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --base "$RANGE_BASE" --head "$RANGE_HEAD" > "$PLAN_PATH"
          python3 -I -B - "$PLAN_PATH" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          if plan.get("policy") != "talo-pnpm-frozen-root/v1":
              raise SystemExit("TALO_DEPENDENCY_SETUP_POLICY_REFUSED")
          print("node_version=" + plan["node_version"])
          print("pnpm_version=" + plan["pnpm_version"])
          PY

      - name: Pin pnpm for canonical Talomnia-backend candidate verification
        if: github.repository == 'Arcanada-one/talomnia-backend'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ steps.candidate_talo_dependency_setup.outputs.pnpm_version }}
          dest: ${{ runner.temp }}/talo-setup-pnpm

      - name: Pin Node for canonical Talomnia-backend candidate verification
        if: github.repository == 'Arcanada-one/talomnia-backend'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.candidate_talo_dependency_setup.outputs.node_version }}

      - name: Prepare fixed Talomnia-backend verifier dependencies
        if: github.repository == 'Arcanada-one/talomnia-backend'
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          RUNNER_TEMP: ${{ runner.temp }}
          TALO_NODE_VERSION: ${{ steps.candidate_talo_dependency_setup.outputs.node_version }}
        run: |
          set -euo pipefail
          test -f package.json && test ! -L package.json
          test -f pnpm-lock.yaml && test ! -L pnpm-lock.yaml
          CONFIG_ROOT="$RUNNER_TEMP/graph-admission/talo-pnpm-config"
          mkdir -p "$CONFIG_ROOT"
          test ! -e "$CONFIG_ROOT/user.npmrc" && test ! -e "$CONFIG_ROOT/global.npmrc"
          umask 077
          : > "$CONFIG_ROOT/user.npmrc"
          : > "$CONFIG_ROOT/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$CONFIG_ROOT/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$CONFIG_ROOT/global.npmrc"
          pnpm --version | grep -Fx '11.20.0'
          test -n "$TALO_NODE_VERSION"
          test "$(node --version)" = "v${TALO_NODE_VERSION}"
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org/
          pnpm exec prisma generate
          cat "$RUNNER_TEMP/graph-admission/talo-dependency-setup/plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate canonical Model Connector candidate dependencies
        id: candidate_mc_dependency_setup
        if: github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required && steps.self_update_classifier.outputs.case != 'gate_self_update'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          TOOLS_PATH: ${{ inputs.tools_path }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          umask 077
          CONFIG_ROOT="$(mktemp -d "$RUNNER_TEMP/mc-candidate-pnpm.XXXXXXXX")"
          trap 'rm -rf -- "$CONFIG_ROOT"' EXIT
          mkdir -p "$CONFIG_ROOT/tools/graph"
          for input in ci_gate.py sshsig.py; do
            git --no-replace-objects show "$RANGE_HEAD:$TOOLS_PATH/tools/graph/$input" > "$CONFIG_ROOT/tools/graph/$input"
          done
          python3 -I -B "$CONFIG_ROOT/tools/graph/ci_gate.py" candidate-mc-dependency-setup-plan \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --base "$RANGE_BASE" --head "$RANGE_HEAD" --snapshot "$CONFIG_ROOT/snapshot" \
            | tee "$CONFIG_ROOT/plan.json" >> "$GITHUB_STEP_SUMMARY"
          printf 'root=%s\n' "$CONFIG_ROOT" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Recheck Model Connector snapshot before pnpm bootstrap
        id: candidate_mc_bootstrap_snapshot
        if: github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required && steps.self_update_classifier.outputs.case != 'gate_self_update'
        env:
          CONFIG_ROOT: ${{ steps.candidate_mc_dependency_setup.outputs.root }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          test -n "$CONFIG_ROOT"
          python3 -I -B "$CONFIG_ROOT/tools/graph/ci_gate.py" candidate-mc-dependency-snapshot-verify \
            --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --base "$RANGE_BASE" --head "$RANGE_HEAD" --snapshot "$CONFIG_ROOT/snapshot" \
            --plan "$CONFIG_ROOT/plan.json" --phase bootstrap
          # action-setup joins this input to GITHUB_WORKSPACE.
          manifest="$(python3 -I -B -c 'import os, sys; print(os.path.relpath(sys.argv[1], sys.argv[2]))' \
            "$CONFIG_ROOT/snapshot/package.json" "$GITHUB_WORKSPACE")"
          printf 'package_json_file=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Pin pnpm for Model Connector candidate verification
        if: github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required && steps.self_update_classifier.outputs.case != 'gate_self_update'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.30.3'
          dest: ${{ runner.temp }}/mc-setup-pnpm
          package_json_file: ${{ steps.candidate_mc_bootstrap_snapshot.outputs.package_json_file }}

      - name: Pin Node for Model Connector candidate verification
        if: github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required && steps.self_update_classifier.outputs.case != 'gate_self_update'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Prepare fixed Model Connector candidate verifier dependencies
        if: github.repository == 'Arcanada-one/model-connector' && inputs.candidate_receipt_required && steps.self_update_classifier.outputs.case != 'gate_self_update'
        env:
          CONFIG_ROOT: ${{ steps.candidate_mc_dependency_setup.outputs.root }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CONFIG_ROOT"
          trap 'rm -rf -- "$CONFIG_ROOT"' EXIT
          test "$(node --version)" = v22.23.4
          : > "$CONFIG_ROOT/user.npmrc"
          : > "$CONFIG_ROOT/global.npmrc"
          SNAPSHOT="$CONFIG_ROOT/snapshot"
          PLAN="$CONFIG_ROOT/plan.json"
          TOOL="$CONFIG_ROOT/tools/graph/ci_gate.py"
          verify_snapshot() {
            python3 -I -B "$TOOL" candidate-mc-dependency-snapshot-verify \
              --repo "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
              --base "$RANGE_BASE" --head "$RANGE_HEAD" --snapshot "$SNAPSHOT" --plan "$PLAN" --phase "$1"
          }
          cd "$SNAPSHOT"
          test "$(env -i PATH="$PATH" HOME="$CONFIG_ROOT" pnpm --version)" = 10.30.3
          verify_snapshot install
          env -i PATH="$PATH" HOME="$CONFIG_ROOT" CI=true \
            NPM_CONFIG_USERCONFIG="$CONFIG_ROOT/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$CONFIG_ROOT/global.npmrc" \
            pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org/
          verify_snapshot generate
          env -i PATH="$PATH" HOME="$CONFIG_ROOT" CI=true DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy \
            NPM_CONFIG_USERCONFIG="$CONFIG_ROOT/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$CONFIG_ROOT/global.npmrc" \
            ./node_modules/.bin/prisma generate --config prisma.config.ts
          verify_snapshot publish

      # Preserve the unchanged-input setup for the authenticated self-update.
      - name: Prepare canonical Model Connector self-update verifier dependencies
        if: github.repository == 'Arcanada-one/model-connector' && steps.self_update_classifier.outputs.case == 'gate_self_update'
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          set -euo pipefail
          test -f package.json && test ! -L package.json
          test -f pnpm-lock.yaml && test ! -L pnpm-lock.yaml
          git diff --quiet "$RANGE_BASE" "$RANGE_HEAD" -- package.json pnpm-lock.yaml prisma
          python3 -I -B - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          if package.get('name') != 'model-connector' or package.get('packageManager') != 'pnpm@10.30.3':
              raise SystemExit('MODEL_SELF_UPDATE_DEPENDENCY_SUBJECT_REFUSED')
          PY
          corepack pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          corepack pnpm exec prisma generate

      - name: jsonschema 4.23.0 for candidate and stage source-input controls
        if: inputs.stage_userpath_required || inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update'
        run: python3 -I -m pip install --disable-pip-version-check --no-input 'jsonschema==4.23.0'

      - name: Provision pinned actionlint for candidate verification
        id: candidate_actionlint
        if: inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
            echo "::error::pinned actionlint requires a Linux x64 runner" >&2
            exit 1
          fi
          tool_dir="$(mktemp -d -- "$RUNNER_TEMP/graph-actionlint.XXXXXXXX")"
          cd -- "$tool_dir"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 60 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xOzf actionlint.tar.gz -- actionlint > actionlint.unverified
          printf '%s\n' 'c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4  actionlint.unverified' | sha256sum --check
          chmod 0755 actionlint.unverified
          mv -- actionlint.unverified actionlint
          printf 'bin_dir=%s\n' "$tool_dir" >> "$GITHUB_OUTPUT"

      # Arm a one-shot Bash startup file for the immediately following producer.
      # The file contains only source-fixed code. Store values stay in separate private data
      # and are exported inside the producer process, never through the job environment.
      - name: Arm the disposable-store producer environment
        id: candidate_store_environment
        if: steps.candidate_disposable_stores.outcome == 'success'
        env:
          CAPTURE_ROOT: ${{ steps.candidate_capture.outputs.stage_root }}
        run: |
          set -euo pipefail
          [[ -d "$CAPTURE_ROOT" && -O "$CAPTURE_ROOT" && "$(realpath -e -- "$CAPTURE_ROOT")" == "$CAPTURE_ROOT" ]]
          [[ "${CAPTURE_ROOT%/*}" == "$RUNNER_TEMP/graph-admission/stage-userpath" && "${CAPTURE_ROOT##*/}" == run.* ]]
          loader="$RUNNER_TEMP/graph-admission/${CAPTURE_ROOT##*/}.producer-env"
          (umask 077; set -C; cat > "$loader" <<'BASH_ENV_LOADER'
          # These step-local keys identify the exact candidate producer. If it was skipped,
          # an always() step must not load any store values.
          if [[ ! -v EMPTY_IMPACT_CLAIM_FILE || ! -v RANGE_BASE_BRANCH || ! -v CANDIDATE_ROOT ]]; then
            unset BASH_ENV
            return 0
          fi
          loader="${BASH_SOURCE[0]}"
          unset BASH_ENV
          capture="$RUNNER_TEMP/graph-admission/stage-userpath/${loader##*/}"
          capture="${capture%.producer-env}"
          if ! (unset GH_TOKEN; rm -- "$loader"); then
            echo "::error::could not disarm the disposable-store producer environment" >&2
            exit 2
          fi
          GRAPH_CHECK_RUN_ID='${{ job.check_run_id }}'
          binding="${RUNNER_TEMP:?}/graph-admission/${capture##*/}.stores"
          if [[ ! -f "$binding" || -L "$binding" || ! -O "$binding" || "$(unset GH_TOKEN; stat -c %a -- "$binding")" != 600 ]] ||
             ! mapfile -d '' -t store < "$binding" || [ "${#store[@]}" -ne 6 ]; then
            echo "::error::owned disposable-store binding is missing or invalid" >&2
            exit 2
          fi
          case "$GITHUB_REPOSITORY:${store[0]}" in
            Arcanada-one/muneral:muneral-candidate-postgres-v1)
              [[ "${store[1]}" =~ ^postgresql://test:[0-9a-f]{32}@127\.0\.0\.1:[0-9]{1,5}/muneral_test$ &&
                 -z "${store[2]}${store[3]}${store[4]}${store[5]}" ]] || exit 2
              ;;
            Arcanada-one/model-connector:model-connector-disposable-store-v1)
              [[ "${store[1]}" =~ ^postgresql://test:test@127\.0\.0\.1:[0-9]{1,5}/connector_test$ &&
                 "${store[2]}" == 127.0.0.1 && "${store[3]}" =~ ^[0-9]{1,5}$ &&
                 "${store[4]}" == "mc-ga-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GRAPH_CHECK_RUN_ID}:" &&
                 "${store[5]}" == "$RUNNER_TEMP/mc-owned-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GRAPH_CHECK_RUN_ID}/socket" ]] || exit 2
              # Pass current-job identity independently of the binding fields, so the
              # consumer can reject an otherwise consistent binding from a different job.
              export GRAPH_CHECK_RUN_ID
              ;;
            *) echo "::error::disposable-store binding does not match the caller" >&2; exit 2 ;;
          esac
          if ! (unset GH_TOKEN; rm -- "$binding"); then
            echo "::error::could not remove the consumed disposable-store binding" >&2
            exit 2
          fi
          export GRAPH_DISPOSABLE_STORE_PROFILE="${store[0]}" DATABASE_URL="${store[1]}" \
            REDIS_HOST="${store[2]}" REDIS_PORT="${store[3]}" REDIS_PREFIX="${store[4]}" \
            BENCH_OWNED_TEST_PG_SOCKET="${store[5]}"
          export CANDIDATE_ROOT="$capture/current-candidate"
          BASH_ENV_LOADER
          )
          printf 'BASH_ENV=%s\n' "$loader" >> "$GITHUB_ENV"

      - name: Produce the exact current Program candidate CAR
        id: candidate_receipt
        if: inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update'
        env:
          ACTIONLINT_BIN_DIR: ${{ steps.candidate_actionlint.outputs.bin_dir }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RANGE_BASE_BRANCH: ${{ steps.range.outputs.base_branch }}
          CANDIDATE_ROOT: ${{ runner.temp }}/graph-admission/stage-userpath/current-candidate
          TOOLS_PATH: ${{ inputs.tools_path }}
          SELF_UPDATE_CASE: ${{ steps.self_update_classifier.outputs.case }}
          CANDIDATE_SOURCE_OUTCOME_REQUIRED: ${{ inputs.candidate_source_outcome_required }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERIFIER_JOB: ${{ inputs.verifier_job }}
          VERIFIER_CONCLUSION: ${{ inputs.verifier_conclusion }}
          EMPTY_IMPACT_EXPLANATION: ${{ inputs.empty_impact_explanation }}
          CANDIDATE_CANARY_PATH: ${{ inputs.candidate_canary_path }}
          EMPTY_IMPACT_CLAIM_FILE: ${{ steps.range.outputs.claim_file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TYPECHECK_TOKEN="${GH_TOKEN:-}"
          unset GH_TOKEN
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/arcanada-universal-program" ]; then
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE"
          else
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE/$TOOLS_PATH"
          fi
          if [ ! -f "$GRAPH_TOOLS_ROOT/tools/graph/build_graph.py" ] || [ -L "$GRAPH_TOOLS_ROOT/tools/graph/build_graph.py" ] \
             || [ ! -f "$GRAPH_TOOLS_ROOT/tools/graph/verify.py" ] || [ -L "$GRAPH_TOOLS_ROOT/tools/graph/verify.py" ]; then
            echo "::error::candidate producer source is missing from the selected Program source" >&2
            exit 2
          fi
          mkdir -p "$(dirname "$CANDIDATE_ROOT")"
          if ! mkdir "$CANDIDATE_ROOT"; then
            echo "::error::current-source capture root already exists or cannot be created"
            exit 2
          fi
          mkdir -p "$CANDIDATE_ROOT/work" "$CANDIDATE_ROOT/verifier-out"
          EMPTY_IMPACT_PATH="$CANDIDATE_ROOT/empty-impact-explanation.json"
          if [ -n "${EMPTY_IMPACT_CLAIM_FILE:-}" ] && [ -n "${EMPTY_IMPACT_EXPLANATION:-}" ]; then
            echo "::error::a committed empty-impact claim and the empty_impact_explanation input are both present" >&2
            exit 2
          fi
          if [ -n "${EMPTY_IMPACT_EXPLANATION:-}" ] || [ -n "${EMPTY_IMPACT_CLAIM_FILE:-}" ]; then
            if [ "$CANDIDATE_SOURCE_OUTCOME_REQUIRED" != "true" ]; then
              echo "::error::empty-impact explanation requires same-run current-source outcome capture" >&2
              exit 2
            fi
            if [ -n "${EMPTY_IMPACT_CLAIM_FILE:-}" ]; then
              # the claim blob was read by git at the exact PR head and validated before any head code ran
              if ! (umask 077; set -C; cp -- "$EMPTY_IMPACT_CLAIM_FILE" "$EMPTY_IMPACT_PATH"); then
                echo "::error::committed empty-impact claim could not be captured safely" >&2
                exit 2
              fi
            elif ! (umask 077; set -C; printf '%s' "$EMPTY_IMPACT_EXPLANATION" > "$EMPTY_IMPACT_PATH"); then
              echo "::error::empty-impact explanation input could not be captured safely" >&2
              exit 2
            fi
            if ! (umask 077; set -C; sha256sum "$EMPTY_IMPACT_PATH" | cut -d ' ' -f 1 > "$CANDIDATE_ROOT/empty-impact-explanation.sha256"); then
              echo "::error::empty-impact explanation input digest could not be captured safely" >&2
              exit 2
            fi
          fi
          export PYTHONDONTWRITEBYTECODE=1
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/auth-arcana" ]; then
            TYPECHECK_ARGV=(python3 -I -B "$GRAPH_TOOLS_ROOT/tools/graph/full_suite_ci.py" collect-root-typecheck
              --repo "$GITHUB_WORKSPACE" --repo-name "$GITHUB_REPOSITORY"
              --source "$RANGE_HEAD" --base "$RANGE_BASE"
              --event-file "$GITHUB_EVENT_PATH"
              --evidence-root "$CANDIDATE_ROOT/ci-typecheck")
            if [ -n "$TYPECHECK_TOKEN" ]; then
              GH_TOKEN="$TYPECHECK_TOKEN" "${TYPECHECK_ARGV[@]}"
            else
              "${TYPECHECK_ARGV[@]}"
            fi
            TYPECHECK_RESULT=$?
            if [ "$TYPECHECK_RESULT" -ne 0 ]; then
              echo "::error::root typecheck evidence collection failed closed" >&2
              exit 2
            fi
          fi
          BUILD_ARGV=(python3 "$GRAPH_TOOLS_ROOT/tools/graph/build_graph.py" . --rev "$RANGE_BASE" --out "$CANDIDATE_ROOT/base-graph.json")
          printf '%s\0' "${BUILD_ARGV[@]}" > "$CANDIDATE_ROOT/build.argv.nul"
          pwd -P > "$CANDIDATE_ROOT/build.cwd"
          date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/build-start.utc"
          set +e
          "${BUILD_ARGV[@]}" > "$CANDIDATE_ROOT/build.stdout" 2> "$CANDIDATE_ROOT/build.stderr" &
          BUILD_PID=$!
          printf '%s\n' "$BUILD_PID" > "$CANDIDATE_ROOT/build.pid"
          wait "$BUILD_PID"
          BUILD_RC=$?
          date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/build-end.utc"
          printf '%s\n' "$BUILD_RC" > "$CANDIDATE_ROOT/build.exit"
          VERIFY_RC=$BUILD_RC
          if [ "$BUILD_RC" = "0" ]; then
            VERIFY_ARGV=(python3 "$GRAPH_TOOLS_ROOT/tools/graph/verify.py" --repo . --diff "$RANGE_BASE..$RANGE_HEAD"
              --graph "$CANDIDATE_ROOT/base-graph.json" --out "$CANDIDATE_ROOT/receipt.json" --json
              --workdir "$CANDIDATE_ROOT/work" --verifier-out "$CANDIDATE_ROOT/verifier-out"
              --phase-log "$CANDIDATE_ROOT/phase.jsonl")
            if [ -n "${EMPTY_IMPACT_EXPLANATION:-}" ] || [ -n "${EMPTY_IMPACT_CLAIM_FILE:-}" ]; then
              VERIFY_ARGV+=(--empty-impact-explanation "$EMPTY_IMPACT_PATH")
            fi
            if [ "$GITHUB_REPOSITORY" = "Arcanada-one/auth-arcana" ]; then
              VERIFY_ARGV+=(--root-typecheck-ci-root "$CANDIDATE_ROOT/ci-typecheck")
            fi
            if [ -n "${CANDIDATE_CANARY_PATH:-}" ]; then
              VERIFY_ARGV+=("--canary=$CANDIDATE_CANARY_PATH" --require-committed-canary-v2)
            fi
            printf '%s\0' "${VERIFY_ARGV[@]}" > "$CANDIDATE_ROOT/verify.argv.nul"
            pwd -P > "$CANDIDATE_ROOT/verify.cwd"
            date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/verify-start.utc"
            VERIFY_PATH="${ACTIONLINT_BIN_DIR:?verified actionlint directory is missing}:$PATH"
            if [ "$GITHUB_REPOSITORY" = "Arcanada-one/auth-arcana" ] && [ -n "$TYPECHECK_TOKEN" ]; then
              PATH="$VERIFY_PATH" GH_TOKEN="$TYPECHECK_TOKEN" "${VERIFY_ARGV[@]}" > "$CANDIDATE_ROOT/verify.stdout" 2> "$CANDIDATE_ROOT/verify.stderr" &
            else
              PATH="$VERIFY_PATH" "${VERIFY_ARGV[@]}" > "$CANDIDATE_ROOT/verify.stdout" 2> "$CANDIDATE_ROOT/verify.stderr" &
            fi
            VERIFY_PID=$!
            printf '%s\n' "$VERIFY_PID" > "$CANDIDATE_ROOT/verify.pid"
            wait "$VERIFY_PID"
            VERIFY_RC=$?
            date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/verify-end.utc"
            printf '%s\n' "$VERIFY_RC" > "$CANDIDATE_ROOT/verify.exit"
          fi
          RECEIPT=""
          if [ -f "$CANDIDATE_ROOT/receipt.json" ] && [ ! -L "$CANDIDATE_ROOT/receipt.json" ]; then
            RECEIPT="$CANDIDATE_ROOT/receipt.json"
          fi
          CANDIDATE_RC="$VERIFY_RC"
          # A self-update is issued only after the authenticated native classifier selected exactly
          # gate_self_update. Keep verify.py's raw draft immutable and distinct from the native
          # issuer's derived receipt; C16 in the final ordinary gate remeasures that same-job result.
          if [ "$SELF_UPDATE_CASE" = "gate_self_update" ] && [ "$CANDIDATE_SOURCE_OUTCOME_REQUIRED" != "true" ]; then
            RAW_RECEIPT="$CANDIDATE_ROOT/receipt.json"
            ISSUED_RECEIPT="$CANDIDATE_ROOT/issued-receipt.json"
            EXEMPTION_EVIDENCE="$CANDIDATE_ROOT/exemption-evidence.json"
            EXEMPTION_WORK="$CANDIDATE_ROOT/exemption-work"
            RECEIPT=""
            CANDIDATE_RC=3
            RAW_BEFORE=""
            if [ -f "$RAW_RECEIPT" ] && [ ! -L "$RAW_RECEIPT" ]; then
              RAW_BEFORE="$(sha256sum "$RAW_RECEIPT" | cut -d ' ' -f 1)"
            fi
            RAW_VALID=false
            if [ -n "$RAW_BEFORE" ] && python3 -I -B - "$GRAPH_TOOLS_ROOT/tools/graph" "$RAW_RECEIPT" "$GITHUB_REPOSITORY" "$RANGE_BASE" "$RANGE_HEAD" "$VERIFY_RC" <<'PY'
          import json
          import sys
          from pathlib import Path

          tools, raw_path = Path(sys.argv[1]), Path(sys.argv[2])
          repo, base, head, exit_text = sys.argv[3:]
          sys.path.insert(0, str(tools))
          import schema_check

          try:
              receipt = json.loads(raw_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit(1)
          change = receipt.get("change_set") if isinstance(receipt, dict) else None
          if (schema_check.classify(receipt).get("verdict") != "conformant"
                  or receipt.get("schema") != "ChangeAdmissionReceipt/v1"
                  or (receipt.get("repo") or {}).get("name") != repo
                  or not isinstance(change, dict) or change.get("mode") != "diff"
                  or change.get("base") != base or change.get("head") != head):
              raise SystemExit(1)
          rows = receipt.get("verdicts")
          if not isinstance(rows, list) or not rows:
              raise SystemExit(1)
          counts = {name: sum(isinstance(row, dict) and row.get("verdict") == name for row in rows)
                    for name in ("verified", "not_measured", "failed")}
          if sum(counts.values()) != len(rows):
              raise SystemExit(1)
          admission = (receipt.get("admission") or {}).get("verdict")
          exit_code = int(exit_text)
          valid = ((exit_code == 0 and admission == "admitted" and counts["verified"] == len(rows))
                   or (exit_code == 1 and admission == "paused_safe" and counts["verified"] > 0
                       and counts["not_measured"] > 0 and counts["failed"] == 0))
          raise SystemExit(0 if valid else 1)
          PY
            then
              RAW_VALID=true
            fi
            printf '%s\n' "$RAW_VALID" > "$CANDIDATE_ROOT/raw-draft-eligible.txt"
            if [ "$RAW_VALID" = "true" ]; then
            EXEMPT_ARGV=(python3 "$GRAPH_TOOLS_ROOT/tools/graph/admit_change.py" exempt
              --repo "$GITHUB_WORKSPACE" --range "$RANGE_BASE..$RANGE_HEAD"
              --base-branch "$RANGE_BASE_BRANCH" --receipt "$RAW_RECEIPT" --out "$ISSUED_RECEIPT"
              --evidence-out "$EXEMPTION_EVIDENCE" --bundle-dir "$TOOLS_PATH"
              --repo-name "$GITHUB_REPOSITORY" --workdir "$EXEMPTION_WORK")
            if [ -n "${VERIFIER_JOB:-}" ]; then EXEMPT_ARGV+=(--verifier-job "$VERIFIER_JOB"); fi
            if [ -n "${VERIFIER_CONCLUSION:-}" ]; then EXEMPT_ARGV+=(--verifier-conclusion "$VERIFIER_CONCLUSION"); fi
            printf '%s\0' "${EXEMPT_ARGV[@]}" > "$CANDIDATE_ROOT/exempt.argv.nul"
            pwd -P > "$CANDIDATE_ROOT/exempt.cwd"
            date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/exempt-start.utc"
            "${EXEMPT_ARGV[@]}" > "$CANDIDATE_ROOT/exempt.stdout" 2> "$CANDIDATE_ROOT/exempt.stderr" &
            EXEMPT_PID=$!
            printf '%s\n' "$EXEMPT_PID" > "$CANDIDATE_ROOT/exempt.pid"
            wait "$EXEMPT_PID"
            EXEMPT_RC=$?
            date -u +%FT%T.%NZ > "$CANDIDATE_ROOT/exempt-end.utc"
            printf '%s\n' "$EXEMPT_RC" > "$CANDIDATE_ROOT/exempt.exit"
            RAW_AFTER=""
            if [ -f "$RAW_RECEIPT" ] && [ ! -L "$RAW_RECEIPT" ]; then
              RAW_AFTER="$(sha256sum "$RAW_RECEIPT" | cut -d ' ' -f 1)"
            fi
            if [ "$EXEMPT_RC" = "0" ] && [ -n "$RAW_BEFORE" ] && [ "$RAW_BEFORE" = "$RAW_AFTER" ]; then
              if python3 -I - "$EXEMPTION_EVIDENCE" "$ISSUED_RECEIPT" "$GITHUB_REPOSITORY" "$RANGE_BASE" "$RANGE_HEAD" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          evidence_path, receipt_path = map(Path, sys.argv[1:3])
          repo, base, head = sys.argv[3:]
          try:
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit(1)
          change = receipt.get("change_set") if isinstance(receipt, dict) else None
          exemptions = receipt.get("exemptions") if isinstance(receipt, dict) else None
          binding = (evidence.get("evidence") or {}).get("change_binding") if isinstance(evidence, dict) else None
          if (not isinstance(evidence, dict) or evidence.get("repo") != repo
                  or evidence.get("case") != "gate_self_update" or evidence.get("eligible") is not True
                  or evidence.get("range") != {"base": base, "head": head}
                  or not isinstance(binding, dict) or binding.get("base") != base or binding.get("head") != head
                  or not re.fullmatch(r"sha256:[0-9a-f]{64}", str(binding.get("digest", "")))
                  or not isinstance(change, dict) or receipt.get("schema") != "ChangeAdmissionReceipt/v1"
                  or (receipt.get("repo") or {}).get("name") != repo
                  or change.get("mode") != "diff" or change.get("base") != base or change.get("head") != head
                  or not isinstance(exemptions, list) or not exemptions
                  or any(item.get("code") != "GATE_SELF_UPDATE" for item in exemptions if isinstance(item, dict))
                  or any(not isinstance(item, dict) for item in exemptions)):
              raise SystemExit(1)
          PY
              then
                RECEIPT="$ISSUED_RECEIPT"
                CANDIDATE_RC=0
              fi
            fi
            fi
          fi
          {
            echo "receipt=$RECEIPT"
            echo "exit=$CANDIDATE_RC"
          } >> "$GITHUB_OUTPUT"
          # The native gate consumes this exact candidate output and refuses a missing file or
          # nonzero producer result; this step's success cannot turn a refused CAR into a pass.
          exit 0

      - name: Run the Program-stage SharedVerifierV1 userpath
        id: stage_userpath
        if: inputs.stage_userpath_required
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          REPO_NAME: ${{ github.repository }}
          STAGE_ROOT: ${{ steps.candidate_capture.outputs.stage_root || format('{0}/graph-admission/stage-userpath', runner.temp) }}
          CANDIDATE_ROOT: ${{ steps.candidate_capture.outputs.candidate_root || format('{0}/graph-admission/stage-userpath/current-candidate', runner.temp) }}
          CANDIDATE_SOURCE_OUTCOME_REQUIRED: ${{ inputs.candidate_source_outcome_required }}
          TOOLS_PATH: ${{ inputs.tools_path }}
          CANDIDATE_CANARY_PATH: ${{ inputs.candidate_canary_path }}
        run: |
          set -uo pipefail
          set +e
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/arcanada-universal-program" ]; then
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE"
          else
            GRAPH_TOOLS_ROOT="$GITHUB_WORKSPACE/$TOOLS_PATH"
          fi
          mkdir -p "$STAGE_ROOT/work"
          date -u +%FT%TZ > "$STAGE_ROOT/outer-start.utc"
          ARGS=()
          if [ "$CANDIDATE_SOURCE_OUTCOME_REQUIRED" = "true" ]; then
            ARGS+=(--candidate-root "$CANDIDATE_ROOT")
          fi
          if [ -n "${CANDIDATE_CANARY_PATH:-}" ]; then
            ARGS+=("--candidate-canary=$CANDIDATE_CANARY_PATH")
          fi
          python3 "$GRAPH_TOOLS_ROOT/tools/ci/stage_userpath.py" \
            --repo "$GITHUB_WORKSPACE" \
            --repo-name "$REPO_NAME" \
            --base "$RANGE_BASE" \
            --head "$RANGE_HEAD" \
            --out "$STAGE_ROOT/result.json" \
            --workdir "$STAGE_ROOT/work" \
            --tools-root "$GRAPH_TOOLS_ROOT" \
            "${ARGS[@]}" \
            > "$STAGE_ROOT/runner.stdout" 2> "$STAGE_ROOT/runner.stderr"
          RC=$?
          date -u +%FT%TZ > "$STAGE_ROOT/outer-end.utc"
          printf '%s\n' "$RC" > "$STAGE_ROOT/outer-exit.txt"
          {
            echo "result=$STAGE_ROOT/result.json"
            echo "root=$STAGE_ROOT"
            echo "exit=$RC"
            echo "candidate_receipt=$STAGE_ROOT/current-candidate/receipt.json"
            echo "candidate_receipt_exit=$(cat "$STAGE_ROOT/current-candidate/verify.exit" 2>/dev/null || cat "$STAGE_ROOT/current-candidate/build.exit" 2>/dev/null || echo 127)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # A2-108. THE PROGRAM REPOSITORY GATES ITSELF, and it is the one caller that cannot use a
      # vendored bundle: the tools it would vendor are the tools it ships, so a committed copy would
      # be a second, drifting truth, and the gate would judge a change to `tools/graph/` against an
      # older version of itself. Here the bundle is built from THIS pull request's own head tree into
      # the runner's temp directory — never committed, never stale by construction.
      #
      # The guard is `github.repository`, which in a reusable workflow is the CALLING repository and
      # is not a workflow input: a caller cannot set it, so no caller can reach this path to escape
      # bundle verification. In every other repository the step is skipped and nothing changes.
      #
      # The signature is made with a key generated in this job and thrown away with it. What that
      # proves is exactly what the gate then reports as `BUNDLE_SIGNATURE_UNPINNED` — self-consistency,
      # not provenance — and `not_measured` is never a pass (DEC-AUP-0008 I4). There is no provenance
      # claim a repository can make about its own tools by signing them; what stands behind these
      # tools is this repository's git history and its review, which is the honest answer rather than
      # a ceremony that looks cryptographic.
      - name: Build the gate bundle from this repository's own tree (program repository only)
        id: selftools
        if: github.repository == 'Arcanada-one/arcanada-universal-program'
        env:
          PROGRAM_REF: ${{ inputs.program_ref }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/self-bundle-signing-key"
          ssh-keygen -t ed25519 -N '' -q -f "$key" \
            -C 'ephemeral GraphAdmissionBundle/v1 key — generated and discarded inside one CI job'
          # `ci_gate.py bundle --sign-key` also copies the signing public key over the repository's
          # own contracts/graph-verified-change/bundle-signing-key.pub (ci_gate.py:174) — it assumes
          # it is being run BY the signing host TO publish a new key. Here it is a side effect on the
          # tree under test, so the committed bytes are put back before anything reads them.
          committed='contracts/graph-verified-change/bundle-signing-key.pub'
          cp "$committed" "${RUNNER_TEMP}/committed-signing-key.pub"
          python3 tools/graph/ci_gate.py bundle \
            --out "${RUNNER_TEMP}/self-bundle" --program-ref "$PROGRAM_REF" --sign-key "$key"
          cp "${RUNNER_TEMP}/committed-signing-key.pub" "$committed"
          git diff --quiet -- "$committed"
          echo "path=${RUNNER_TEMP}/self-bundle" >> "$GITHUB_OUTPUT"

      - name: Write the pull-request body from the GitHub event file
        env:
          PR_BODY_FILE: ${{ runner.temp }}/graph-admission/pr-body.txt
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/graph-admission"
          python3 - <<'PY'
          import json, os, stat, sys

          MAX_EVENT_BYTES = 16 * 1024 * 1024
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          output_path = os.environ["PR_BODY_FILE"]
          if not event_path:
              raise SystemExit("GRAPH_ADMISSION_EVENT_FILE_MISSING: GITHUB_EVENT_PATH is unset")
          try:
              fd = os.open(event_path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_size > MAX_EVENT_BYTES:
                      raise ValueError("event file is not a bounded regular file")
                  chunks, total = [], 0
                  while True:
                      chunk = os.read(fd, min(65536, MAX_EVENT_BYTES + 1 - total))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      total += len(chunk)
                      if total > MAX_EVENT_BYTES:
                          raise ValueError("event file grew beyond the input limit")
              finally:
                  os.close(fd)
              event = json.loads(b"".join(chunks).decode("utf-8"))
              if not isinstance(event, dict):
                  raise ValueError("event payload must be a JSON object")
              pull_request = event.get("pull_request")
              if pull_request is None:
                  body = ""
              elif not isinstance(pull_request, dict):
                  raise ValueError("pull_request must be an object")
              else:
                  body = pull_request.get("body")
                  if body is None:
                      body = ""
                  if not isinstance(body, str):
                      raise ValueError("pull_request.body must be a string or null")
              output_fd = os.open(output_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
              try:
                  if not stat.S_ISREG(os.fstat(output_fd).st_mode):
                      raise ValueError("body output is not a regular file")
                  data = body.encode("utf-8")
                  offset = 0
                  while offset < len(data):
                      offset += os.write(output_fd, data[offset:])
              finally:
                  os.close(output_fd)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
              print("GRAPH_ADMISSION_EVENT_FILE_INVALID: " + str(exc), file=sys.stderr)
              raise SystemExit(2)
          PY

      - name: Run the admission gate from the pinned program SHA
        id: gate
        # EVERY value this step needs arrives through `env:`, never through a `${{ }}` expansion
        # inside the script. A workflow_call input is caller-controlled text, and an expansion is
        # pasted into the shell BEFORE the shell parses it, so a value carrying a quote or a `$(…)`
        # would be code, not an argument. `zizmor --persona auditor --min-severity high` reports
        # exactly this as template-injection; the ecosystem's strictest CI (prompt-assembly) runs
        # that audit over .github/workflows/, so a vendored copy of this file must survive it.
        env:
          RECEIPT_GLOBS: ${{ inputs.receipt_globs }}
          BUILD_GRAPH: ${{ inputs.build_graph }}
          TOOLS_PATH: ${{ steps.selftools.outputs.path || inputs.tools_path }}
          PROGRAM_REF: ${{ inputs.program_ref }}
          ENFORCEMENT: ${{ inputs.enforcement }}
          REPO_NAME: ${{ github.repository }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
          RANGE_BASE_BRANCH: ${{ steps.range.outputs.base_branch }}
          # AUP-GRAPH-006:gate2a — the automated-author path. GITHUB_EVENT_PATH is the payload GitHub
          # itself delivered; it is the ONLY source of author identity the gate consults. The head
          # branch name is never consulted: anyone who can open a pull request can name their branch
          # `dependabot/anything`.
          EVENT_PATH: ${{ github.event_path }}
          VERIFIER_JOB: ${{ inputs.verifier_job }}
          VERIFIER_CONCLUSION: ${{ inputs.verifier_conclusion }}
          VERIFIER_OUTPUT_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGNING_KEY_FINGERPRINT: ${{ inputs.signing_key_fingerprint }}
          STAGE_EVIDENCE_PATH: ${{ inputs.stage_evidence_path }}
          STAGE_EVIDENCE_ROOT: ${{ inputs.stage_evidence_root }}
          STAGE_EVIDENCE_REQUIRED: ${{ inputs.stage_evidence_required }}
          CURRENT_EVALUATOR_RUN_ID: ${{ github.run_id }}
          CURRENT_EVALUATOR_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_CANARY_PATH: ${{ inputs.candidate_canary_path }}
          CURRENT_EVALUATOR_CHECK_RUN_ID: ${{ job.check_run_id }}
          CURRENT_EVALUATOR_JOB_KEY: ${{ github.job }}
          CURRENT_EVALUATOR_REPOSITORY: ${{ github.repository }}
          CURRENT_EVALUATOR_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_EVALUATOR_CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          # actionlint 1.7.12's job type lacks workflow_*; GitHub still populates those fields at
          # runtime on reusable-workflow jobs. Serialize the whole job object (same pattern as
          # ACTIVE_WORKFLOW_CONTEXT above) and extract below — do NOT substitute github.workflow_ref
          # / github.workflow_sha here: those are the CALLER bindings already mapped above.
          CURRENT_EVALUATOR_JOB_CONTEXT: ${{ toJSON(job) }}
          STAGE_USERPATH_RESULT: ${{ steps.stage_userpath.outputs.result }}
          STAGE_USERPATH_ROOT: ${{ steps.stage_userpath.outputs.root }}
          STAGE_USERPATH_REQUIRED: ${{ inputs.stage_userpath_required }}
          STAGE_USERPATH_EXIT: ${{ steps.stage_userpath.outputs.exit }}
          CANDIDATE_RECEIPT: ${{ steps.candidate_receipt.outputs.receipt }}
          CANDIDATE_RECEIPT_EXIT: ${{ steps.candidate_receipt.outputs.exit }}
          CANDIDATE_ROOT: ${{ steps.candidate_capture.outputs.candidate_root || format('{0}/graph-admission/stage-userpath/current-candidate', runner.temp) }}
          CANDIDATE_RECEIPT_REQUIRED: ${{ inputs.candidate_receipt_required || steps.self_update_classifier.outputs.case == 'gate_self_update' }}
          CANDIDATE_SOURCE_OUTCOME_REQUIRED: ${{ inputs.candidate_source_outcome_required }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TYPECHECK_TOKEN="${GH_TOKEN:-}"
          unset GH_TOKEN
          # NOT `set -e`: the gate's non-zero exit is a VERDICT, not a crash. The step must still
          # write the summary, upload the result and hand the verdict to the last step, which is the
          # single place the check turns red (GitHub starts this shell with -e; it is cleared here).
          set +e
          # Extract reusable-workflow identity from toJSON(job). actionlint 1.7.12 rejects
          # job.workflow_*; GitHub still provides those keys at runtime (see ACTIVE_WORKFLOW_CONTEXT).
          CURRENT_EVALUATOR_WORKFLOW_REPOSITORY="$(python3 -c 'import json,os; print(json.loads(os.environ.get("CURRENT_EVALUATOR_JOB_CONTEXT") or "{}").get("workflow_repository") or "")')"
          CURRENT_EVALUATOR_WORKFLOW_FILE_PATH="$(python3 -c 'import json,os; print(json.loads(os.environ.get("CURRENT_EVALUATOR_JOB_CONTEXT") or "{}").get("workflow_file_path") or "")')"
          CURRENT_EVALUATOR_WORKFLOW_REF="$(python3 -c 'import json,os; print(json.loads(os.environ.get("CURRENT_EVALUATOR_JOB_CONTEXT") or "{}").get("workflow_ref") or "")')"
          CURRENT_EVALUATOR_WORKFLOW_SHA="$(python3 -c 'import json,os; print(json.loads(os.environ.get("CURRENT_EVALUATOR_JOB_CONTEXT") or "{}").get("workflow_sha") or "")')"
          ARGS=()
          if [ -n "${RANGE_BASE_BRANCH:-}" ]; then ARGS+=(--base-branch "$RANGE_BASE_BRANCH"); fi
          while IFS= read -r g; do [ -n "$g" ] && ARGS+=(--receipt-glob "$g"); done <<< "$RECEIPT_GLOBS"
          if [ "$BUILD_GRAPH" = "true" ]; then ARGS+=(--build-graph); fi
          if [ -n "${EVENT_PATH:-}" ] && [ -f "$EVENT_PATH" ]; then ARGS+=(--event-file "$EVENT_PATH"); fi
          if [ -n "${VERIFIER_JOB:-}" ]; then ARGS+=(--verifier-job "$VERIFIER_JOB"); fi
          if [ -n "${VERIFIER_CONCLUSION:-}" ]; then ARGS+=(--verifier-conclusion "$VERIFIER_CONCLUSION"); fi
          ARGS+=(--verifier-output-ref "$VERIFIER_OUTPUT_REF")
          if [ -n "${SIGNING_KEY_FINGERPRINT:-}" ]; then ARGS+=(--signing-key-fingerprint "$SIGNING_KEY_FINGERPRINT"); fi
          if [ -n "${STAGE_EVIDENCE_PATH:-}" ]; then ARGS+=(--stage-evidence "$STAGE_EVIDENCE_PATH"); fi
          if [ -n "${STAGE_EVIDENCE_ROOT:-}" ]; then ARGS+=(--stage-evidence-root "$STAGE_EVIDENCE_ROOT"); fi
          if [ "${STAGE_EVIDENCE_REQUIRED:-false}" = "true" ]; then ARGS+=(--stage-evidence-required); fi
          if [ -n "${CANDIDATE_CANARY_PATH:-}" ]; then
            ARGS+=("--candidate-canary=$CANDIDATE_CANARY_PATH")
          fi
          if [ -n "${STAGE_EVIDENCE_PATH:-}" ]; then
            ARGS+=(--current-evaluator-run-id "$CURRENT_EVALUATOR_RUN_ID"
              --current-evaluator-attempt "$CURRENT_EVALUATOR_ATTEMPT"
              --current-evaluator-check-run-id "$CURRENT_EVALUATOR_CHECK_RUN_ID"
              --current-evaluator-job-key "$CURRENT_EVALUATOR_JOB_KEY"
              --current-evaluator-repository "$CURRENT_EVALUATOR_REPOSITORY"
              --current-evaluator-caller-workflow-ref "$CURRENT_EVALUATOR_CALLER_WORKFLOW_REF"
              --current-evaluator-caller-workflow-sha "$CURRENT_EVALUATOR_CALLER_WORKFLOW_SHA"
              --current-evaluator-workflow-repository "$CURRENT_EVALUATOR_WORKFLOW_REPOSITORY"
              --current-evaluator-workflow-file-path "$CURRENT_EVALUATOR_WORKFLOW_FILE_PATH"
              --current-evaluator-workflow-ref "$CURRENT_EVALUATOR_WORKFLOW_REF"
              --current-evaluator-workflow-sha "$CURRENT_EVALUATOR_WORKFLOW_SHA")
          fi
          if [ -n "${STAGE_USERPATH_RESULT:-}" ]; then ARGS+=(--stage-userpath-result "$STAGE_USERPATH_RESULT"); fi
          if [ -n "${STAGE_USERPATH_ROOT:-}" ]; then ARGS+=(--stage-userpath-root "$STAGE_USERPATH_ROOT"); fi
          if [ "${STAGE_USERPATH_REQUIRED:-false}" = "true" ]; then ARGS+=(--stage-userpath-required); fi
          if [ "${CANDIDATE_SOURCE_OUTCOME_REQUIRED:-false}" = "true" ]; then ARGS+=(--candidate-source-outcome-required); fi
          if [ -n "${STAGE_USERPATH_EXIT:-}" ]; then ARGS+=(--stage-userpath-exit "$STAGE_USERPATH_EXIT"); fi
          if [ "${CANDIDATE_RECEIPT_REQUIRED:-false}" = "true" ]; then
            ARGS+=(--candidate-receipt-required)
            if [ -n "${CANDIDATE_RECEIPT:-}" ]; then ARGS+=(--candidate-receipt "$CANDIDATE_RECEIPT"); fi
            if [ -n "${CANDIDATE_RECEIPT_EXIT:-}" ]; then ARGS+=(--candidate-receipt-exit "$CANDIDATE_RECEIPT_EXIT"); fi
          fi
          if [ "$REPO_NAME" = "Arcanada-one/auth-arcana" ] && [ -n "$TYPECHECK_TOKEN" ] \
             && [ -d "${CANDIDATE_ROOT:-}" ]; then
            ARGS+=(--root-typecheck-ci-root "$CANDIDATE_ROOT/ci-typecheck")
          fi
          GATE_ARGV=(python3 "${TOOLS_PATH}/tools/graph/ci_gate.py" run
            --repo . --repo-name "$REPO_NAME" --tools "$TOOLS_PATH"
            --program-ref "$PROGRAM_REF" --base "$RANGE_BASE" --head "$RANGE_HEAD"
            --pr-body-file "${RUNNER_TEMP}/graph-admission/pr-body.txt"
            --enforcement "$ENFORCEMENT" --workdir "${RUNNER_TEMP}/graph-admission"
            --out "${RUNNER_TEMP}/graph-admission/graph-admission-result.json"
            --summary "${GITHUB_STEP_SUMMARY}" "${ARGS[@]}")
          if [ -n "$TYPECHECK_TOKEN" ] && { [ "$REPO_NAME" = "Arcanada-one/auth-arcana" ] || [ -n "${STAGE_EVIDENCE_PATH:-}" ]; }; then
            GH_TOKEN="$TYPECHECK_TOKEN" "${GATE_ARGV[@]}"
          else
            "${GATE_ARGV[@]}"
          fi
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      # DEC-AUP-0191: retain evidence in the job log (+ host dir when mounted). Never GitHub artifacts.
      # Keep order: gate verdict first (above), retention here, fail-the-check after — retention never
      # changes RC. tools/ci/retain_evidence.py must travel in the signed GraphAdmissionBundle.
      - name: Retain the gate result
        if: always()
        env:
          TOOLS_PATH: ${{ steps.selftools.outputs.path || inputs.tools_path }}
        run: |
          set +e
          ROOT="${TOOLS_PATH:-.github/graph-admission}"
          # Quote globs so Python expands them; shell must not split into multiple --path values.
          python3 "${ROOT}/tools/ci/retain_evidence.py" \
            --name graph-admission-result \
            --path "${RUNNER_TEMP}/graph-admission/*.json" \
            --path "${RUNNER_TEMP}/graph-admission/stage-userpath/" \
            --path "${RUNNER_TEMP}/graph-admission/current-candidate/" \
            --summary "${GITHUB_STEP_SUMMARY}"
          exit 0

      - name: Stop allowlisted candidate disposable stores
        if: >-
          always() && (steps.candidate_disposable_stores.outcome == 'success' ||
          steps.candidate_disposable_stores.outcome == 'failure' ||
          steps.candidate_disposable_stores.outcome == 'cancelled')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
          GRAPH_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -uo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ||
                ! "$GRAPH_CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid disposable-store cleanup identity" >&2
            exit 2
          fi
          STORE_JOB="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GRAPH_CHECK_RUN_ID}"
          case "$GITHUB_REPOSITORY" in
            Arcanada-one/muneral)
              owned_containers=("muneral-ga-pg-${STORE_JOB}")
              ;;
            Arcanada-one/model-connector)
              owned_containers=("model-connector-ga-pg-${STORE_JOB}"
                                "model-connector-ga-redis-${STORE_JOB}")
              ;;
            *)
              echo "::error::refusing cleanup for non-allowlisted caller" >&2
              exit 2
              ;;
          esac
          rc=0
          for name in "${owned_containers[@]}"; do
            filters=(--filter "name=^/${name}$" --filter "label=org.arcanada.graph-store-job=$STORE_JOB")
            if ! found="$(docker ps -a --no-trunc "${filters[@]}" --format '{{.ID}}' 2>/dev/null)"; then
              echo "::error::could not locate owned disposable container: $name" >&2
              rc=1
              continue
            fi
            if [ -z "$found" ]; then continue; fi
            if [[ ! "$found" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::could not verify owned disposable container identity: $name" >&2
              rc=1
              continue
            fi
            # Let PostgreSQL unlink its container-owned files in the sticky socket directory.
            if [[ "$name" == "model-connector-ga-pg-${STORE_JOB}" ]] &&
               ! docker stop --time 15 "$found" >/dev/null 2>&1; then
              echo "::warning::graceful stop failed for owned disposable container; attempting forced removal: $name" >&2
            fi
            if ! docker rm -f -v "$found" >/dev/null 2>&1; then
              echo "::error::could not remove owned disposable container: $found" >&2
              rc=1
            fi
            if ! remaining="$(docker ps -a --no-trunc "${filters[@]}" --format '{{.ID}}' 2>/dev/null)" || [ -n "$remaining" ]; then
              echo "::error::owned disposable container removal could not be verified: $name" >&2
              rc=1
            fi
          done
          if [ "$GITHUB_REPOSITORY" = "Arcanada-one/model-connector" ]; then
            SOCKET_ROOT="${RUNNER_TEMP:?}/mc-owned-postgres-${STORE_JOB}"
            marker="$SOCKET_ROOT/.owner"
            if [[ ! -e "$SOCKET_ROOT" && ! -L "$SOCKET_ROOT" ]]; then
              exit "$rc"
            fi
            if {
              [[ ! -d "$SOCKET_ROOT" || ! -O "$SOCKET_ROOT" ||
                 "$(realpath -e -- "$SOCKET_ROOT")" != "$SOCKET_ROOT" ||
                 "$(stat -c %a -- "$SOCKET_ROOT")" != 700 ||
                 ! -f "$marker" || -L "$marker" || ! -O "$marker" ||
                 "$(stat -c %a -- "$marker")" != 600 ]] ||
              ! SOCKET_INODE="$(stat -c '%d:%i' -- "$SOCKET_ROOT")" ||
              [[ "$(<"$marker")" != "$STORE_JOB $SOCKET_INODE" ]]
            } 2>/dev/null; then
              echo "::error::refusing cleanup of unowned disposable PostgreSQL socket directory" >&2
              rc=1
            elif ! rm -rf -- "$SOCKET_ROOT" >/dev/null 2>&1 || [ -e "$SOCKET_ROOT" ] || [ -L "$SOCKET_ROOT" ]; then
              echo "::error::owned disposable PostgreSQL socket directory could not be removed" >&2
              rc=1
            fi
          fi
          exit "$rc"

      - name: Fail the check on a red verdict
        if: always()
        env:
          RC: ${{ steps.gate.outputs.rc }}
        run: |
          set -uo pipefail
          if [ "${RC:-}" != "0" ]; then
            echo "::error title=graph-admission::the admission gate returned ${RC:-<no verdict>} — see the job summary and the retained graph-admission-result evidence"
            exit 1
          fi
          echo "graph-admission: admitted"

      - name: Remove graph-admission runner temp
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -uo pipefail
          # Refuse non-canonical paths, including symlinks anywhere in either path.
          is_real_directory() {
            local resolved
            [[ "$1" == /* && "$1" != / && -d "$1" ]] &&
              IFS= read -r -d '' resolved < <(realpath -ez -- "$1") &&
              [[ "$resolved" == "$1" ]]
          }
          if [[ "${RUNNER_TEMP:-}" != "${EXPECTED_RUNNER_TEMP:-}" ]] ||
             ! is_real_directory "${RUNNER_TEMP:-}"; then
            echo "::error::RUNNER_TEMP must be the runner's canonical absolute temp directory"
            exit 2
          fi
          ROOT="$RUNNER_TEMP/graph-admission"
          if [[ ! -L "$ROOT" && ! -e "$ROOT" ]]; then
            exit 0
          fi
          if ! is_real_directory "$ROOT"; then
            echo "::error::graph-admission must be a real private directory inside RUNNER_TEMP"
            exit 2
          fi
          if ! rm -rf -- "$ROOT"; then
            echo "::warning::could not remove graph-admission runner temp"
          fi
