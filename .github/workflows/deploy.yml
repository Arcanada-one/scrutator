name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  network-exposure:
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@019f8d9ca6d294404de0e2d93410d4ed8e8f4451 # main 2026-07-22
    with:
      compose_paths: docker-compose.yml
      datarim_ref: d3f518ea11f28f94af9c73021fa96fb4ce3f688f
      runner_labels: '["self-hosted","linux","arcana-prod"]'

  verify-exact-target:
    runs-on: [self-hosted, linux, ci-general, docker]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Security scan
        run: bandit -ll -ii -r src/scrutator/search/navigator.py src/scrutator/search/searcher.py src/scrutator/health.py tools/backfill_sections.py

      - name: Test exact target including real Docker deploy semantics
        env:
          PYTHONPATH: src
          SCRUTATOR_REQUIRE_DOCKER_SEMANTIC_TEST: "1"
        run: pytest tests/ -v

  deploy:
    needs: [network-exposure, verify-exact-target]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: scrutator-prod
      labels: [self-hosted, linux, arcana-db, docker]
    environment: kb-production
    concurrency:
      group: deploy-scrutator
      cancel-in-progress: false
    steps:
      - name: Check out deploy transaction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-deploy host readiness
        id: preflight
        uses: Arcanada-one/datarim/.github/actions/preflight-check@019f8d9ca6d294404de0e2d93410d4ed8e8f4451 # v1, immutable pin
        with:
          target-host: arcana-kb
          service-name: scrutator
          extra-checks: |
            tailscale
            time-skew
            docker-pressure
          ops-bot-emit: "false"

      - name: Deploy
        if: steps.preflight.outputs.status != 'fail'
        env:
          SCRUTATOR_REVIEWED_DEPLOY_SURFACE_SHA: ${{ vars.SCRUTATOR_REVIEWED_DEPLOY_SURFACE_SHA }}
          SCRUTATOR_EMBEDDING_DENSE_SPARSE_ENABLED: ${{ vars.SCRUTATOR_EMBEDDING_DENSE_SPARSE_ENABLED }}
        run: |
          deploy/scrutator-deploy-transaction.sh \
            --target-sha "${GITHUB_SHA}"
