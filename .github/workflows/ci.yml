name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull-request branch supersedes that branch's older run, which
# otherwise keeps queueing on the shared self-hosted runners. Only pull_request
# runs are ever cancelled: push (main), tag, schedule and workflow_dispatch runs get
# a group unique to the run, so they are never cancelled or replaced while pending.
# Job-level deploy locks are separate groups and are not touched.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  network-exposure:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Mandatory per documentation/mandates/cicd-convention.md § 5. This repo's harness code
    # makes outbound-only calls (no new listener) — wired anyway per repo-wide
    # convention, not because this PR introduces a compose/redis/postgres/systemd change.
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@50351e0468f57a39b280d75cf41827329d6393d2
    with:
      compose_paths: docker-compose.yml
      datarim_ref: 50351e0468f57a39b280d75cf41827329d6393d2
      runner_labels: '["self-hosted","linux","arcana-prod"]'

  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, ci-general, docker]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ARC-CI-09 rollout from datarim PR#610 / opsbot PR#147 / argana PR#66 /
      # email-agent PR#43 / doclab-arcana PR#39: pip cache keyed by requirements
      # and pyproject. Trust scope remains Actions branch/PR cache isolation; no
      # restore-keys that pull default-branch caches into fork PRs. Required job
      # names unchanged; deploy cancel-in-progress:false retained in deploy.yml;
      # workflow PR cancel-in-progress expression unchanged.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/ benchmark/scrutator/

      - name: Format check
        run: ruff format --check src/ tests/ benchmark/scrutator/harness.py benchmark/scrutator/tests/

      - name: Security scan (navigation and backfill surface)
        run: bandit -ll -ii -r src/scrutator/search/navigator.py src/scrutator/search/searcher.py src/scrutator/health.py tools/backfill_sections.py

      - name: Test
        run: pytest tests/ -v
        env:
          PYTHONPATH: src
          # The production transaction test may skip only on developer hosts.
          # The trusted self-hosted PR lane has Docker and must execute the
          # semantic image proof.
          SCRUTATOR_REQUIRE_DOCKER_SEMANTIC_TEST: "1"

      # Root C4 (KB-CONS-01-N): hosted lint-and-test must execute this script on
      # the PR head. The runner already has Docker; the script starts a disposable
      # pgvector PostgreSQL and runs the native suite (KC_TEST_PG_ADMIN_DSN set).
      - name: Native KC generation tests (run_with_temp_pg.sh)
        run: bash tests/kc_generations/run_with_temp_pg.sh -v
        env:
          PYTHONPATH: src
          KC_PG_DOCKER_IMAGE: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f

      # Keep this in a separate pytest process: the live-wrapper contract
      # intentionally overrides FastAPI dependencies at module-import time.
      - name: Benchmark tests
        run: pytest benchmark/scrutator/tests/ -v
        env:
          PYTHONPATH: src:benchmark/scrutator
