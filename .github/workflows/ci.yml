name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  network-exposure:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Mandatory per documentation/mandates/cicd-convention.md § 5. This repo's harness code
    # makes outbound-only calls (no new listener) — wired anyway per repo-wide
    # convention, not because this PR introduces a compose/redis/postgres/systemd change.
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@6531b66436b6a735be41a2288082d6de09df3bfa # main 2026-07-22
    with:
      compose_paths: docker-compose.yml
      datarim_ref: d3f518ea11f28f94af9c73021fa96fb4ce3f688f
      runner_labels: '["self-hosted","linux","arcana-prod"]'

  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, ci-general, docker]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/ benchmark/scrutator/

      - name: Format check
        run: ruff format --check src/ tests/ benchmark/scrutator/harness.py benchmark/scrutator/tests/

      - name: Security scan (navigation and backfill surface)
        run: bandit -ll -ii -r src/scrutator/search/navigator.py src/scrutator/search/searcher.py src/scrutator/health.py tools/backfill_sections.py

      - name: Test
        run: pytest tests/ -v
        env:
          PYTHONPATH: src
          # The production transaction test may skip only on developer hosts.
          # The trusted self-hosted PR lane has Docker and must execute the
          # semantic image proof.
          SCRUTATOR_REQUIRE_DOCKER_SEMANTIC_TEST: "1"

      # Keep this in a separate pytest process: the live-wrapper contract
      # intentionally overrides FastAPI dependencies at module-import time.
      - name: Benchmark tests
        run: pytest benchmark/scrutator/tests/ -v
        env:
          PYTHONPATH: src:benchmark/scrutator
