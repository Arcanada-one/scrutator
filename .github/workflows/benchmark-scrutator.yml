name: Scrutator /v1/search Benchmark

permissions:
  contents: read

# This workflow is intentionally manual-only, with no `schedule:` trigger.
# Enabling a recurring schedule puts automated traffic on a
# fixed cadence against the authenticated mesh endpoint plus
# recurring LLM-baseline spend every run. Do not add a `schedule:` trigger without explicit
# operator approval; see benchmark/scrutator/README.md.

on:
  workflow_dispatch:
    inputs:
      golden_set:
        description: 'Golden set path (relative to repo root)'
        type: string
        default: 'benchmark/scrutator/golden/golden-arcanada-v0.jsonl'
      models:
        description: 'Comma-separated model names to dispatch'
        type: string
        default: 'bge-m3'
      recall_threshold:
        description: 'Minimum overall recall@5 required for a passing run'
        type: string
        default: '0.879'

jobs:
  unit-tests:
    # Lint + unit tests only — no network calls.
    runs-on: [self-hosted, linux, arcana-prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check benchmark/scrutator/

      - name: Unit tests
        run: python -m pytest benchmark/scrutator/tests/ -v

  benchmark:
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: scrutator-prod
      labels: [self-hosted, linux, arcana-db, docker]
    environment: kb-production
    # The live API is Tailscale-only. Match the protected recall-regression
    # boundary and retain the runner's live compatibility label `arcana-db`.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Mint short-lived benchmark reader token
        env:
          KB_OBSERVER_CLIENT_SECRET: ${{ secrets.KB_OBSERVER_CLIENT_SECRET }}
          TOKEN_FILE: ${{ runner.temp }}/scrutator-search-reader.jwt
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          secret = os.environ.get("KB_OBSERVER_CLIENT_SECRET", "")
          if not secret:
              raise SystemExit("KB_OBSERVER_CLIENT_SECRET is not configured")
          credentials = base64.b64encode(f"kb-observer:{secret}".encode()).decode()
          body = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "scope": "kb:ltm.read",
              "resource": "urn:arcanada:scrutator:ltm",
          }).encode()
          request = urllib.request.Request(
              "https://auth.arcanada.ai/oidc/token",
              data=body,
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "Arcanada-Scrutator-Search-Benchmark/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response).get("access_token", "")
          if not token:
              raise SystemExit("token endpoint returned no access_token")
          token_path = Path(os.environ["TOKEN_FILE"])
          fd = os.open(
              token_path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL,
              0o600,
          )
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as token_file:
                  fd = -1
                  token_file.write(token)
                  token_file.flush()
                  os.fsync(token_file.fileno())
          except BaseException:
              if fd != -1:
                  os.close(fd)
              token_path.unlink(missing_ok=True)
              raise
          PY

      - name: Run harness (read-only, mesh-internal calls only)
        env:
          GOLDEN_SET: ${{ inputs.golden_set }}
          MODELS: ${{ inputs.models }}
          RECALL_THRESHOLD: ${{ inputs.recall_threshold }}
          SCRUTATOR_BEARER_TOKEN_FILE: ${{ runner.temp }}/scrutator-search-reader.jwt
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          [[ "${GOLDEN_SET}" != *".."* ]]
          [[ "${GOLDEN_SET}" =~ ^benchmark/scrutator/golden/[A-Za-z0-9._/-]+\.jsonl$ ]]
          [[ "${MODELS}" =~ ^[A-Za-z0-9._:/,-]+$ ]]
          [[ "${RECALL_THRESHOLD}" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]]
          python benchmark/scrutator/harness.py \
            --golden "${GOLDEN_SET}" \
            --models "${MODELS}" \
            --namespace arcanada \
            --corpus-root . \
            --recall-threshold "${RECALL_THRESHOLD}" \
            --out-summary results-summary.json

      - name: Remove benchmark reader token
        if: always()
        env:
          TOKEN_FILE: ${{ runner.temp }}/scrutator-search-reader.jwt
        run: rm -f "${TOKEN_FILE}"

      - name: Upload results summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scrutator-benchmark-results
          path: results-summary.json
